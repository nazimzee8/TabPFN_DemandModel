name: Build and Push AutoGluon Image

on:
  push:
    branches:
      - main
    paths:
      - "docker/autogluon/**"
      - "scripts/autogluon_import_timing_probe.py"
      - "scripts/autogluon_ray.py"
      - "scripts/autogluon_worker_access_probe.py"
      - "scripts/ray_capacity_probe.py"
      - "scripts/spcs_ray_coordinator.py"
      - "scripts/spcs_ray_head.py"
      - "scripts/spcs_ray_worker.py"
      - "scripts/spcs_snowpark_session_probe.py"
      - "src/autogluon_models.py"
      - "src/baseline_models.py"
      - "src/deepset_inference.py"
      - "src/evaluate_synthetic_regression.py"
      - "src/model.py"
      - "src/sanity_checks.py"
      - ".dockerignore"
      - ".github/workflows/build-autogluon-image.yml"
  workflow_dispatch:
    inputs:
      snowflake_registry_host:
        description: "Snowflake registry host, e.g. <account>.registry.snowflakecomputing.com"
        required: false
        type: string
      snowflake_image_repository:
        description: "Full image repository URL, e.g. <host>/<db>/<schema>/<repository>"
        required: false
        type: string
      image_version:
        description: "Image tag to publish"
        required: false
        default: "1.0.0"
        type: string

env:
  IMAGE_NAME: tabpfn-autogluon-ray
  DEFAULT_IMAGE_VERSION: 1.0.0

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tags
        id: tags
        env:
          INPUT_REGISTRY_HOST: ${{ inputs.snowflake_registry_host }}
          INPUT_IMAGE_REPOSITORY: ${{ inputs.snowflake_image_repository }}
          INPUT_IMAGE_VERSION: ${{ inputs.image_version }}
          VAR_REGISTRY_HOST: ${{ vars.SNOWFLAKE_REGISTRY_HOST }}
          VAR_IMAGE_REPOSITORY: ${{ vars.SNOWFLAKE_IMAGE_REPOSITORY }}
          VAR_IMAGE_VERSION: ${{ vars.SNOWFLAKE_IMAGE_VERSION }}
        run: |
          registry_host="${INPUT_REGISTRY_HOST:-$VAR_REGISTRY_HOST}"
          image_repository="${INPUT_IMAGE_REPOSITORY:-$VAR_IMAGE_REPOSITORY}"
          image_version="${INPUT_IMAGE_VERSION:-${VAR_IMAGE_VERSION:-$DEFAULT_IMAGE_VERSION}}"

          if [ -z "$registry_host" ]; then
            echo "SNOWFLAKE_REGISTRY_HOST is required. Set a repository variable or pass workflow_dispatch input." >&2
            exit 1
          fi
          if [ -z "$image_repository" ]; then
            echo "SNOWFLAKE_IMAGE_REPOSITORY is required. Set a repository variable or pass workflow_dispatch input." >&2
            exit 1
          fi

          echo "registry_host=${registry_host}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${image_repository}/${IMAGE_NAME}:${image_version}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${image_repository}/${IMAGE_NAME}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/autogluon/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.tags.outputs.version_tag }}
            ${{ steps.tags.outputs.sha_tag }}

      - name: Smoke test image imports
        run: |
          docker run --rm "${{ steps.tags.outputs.version_tag }}" \
            -c "import ray, autogluon.tabular, snowflake.snowpark, pandas, numpy, pyarrow; print('ok')"

      - name: Log in to Snowflake image registry
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.tags.outputs.registry_host }}
          username: ${{ secrets.SNOWFLAKE_REGISTRY_USERNAME }}
          password: ${{ secrets.SNOWFLAKE_REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/autogluon/Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.tags.outputs.version_tag }}
            ${{ steps.tags.outputs.sha_tag }}
